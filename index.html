<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a6192e">
  <title>150prep</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17191d;
      --muted: #676b72;
      --line: #d9dce1;
      --page: #f5f6f7;
      --surface: #ffffff;
      --red: #a6192e;
      --red-dark: #7d1021;
      --teal: #147d76;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--page);
      color: var(--ink);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    header,
    main {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
    }

    header {
      padding: 58px 0 31px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 7px;
      background: var(--red);
      color: white;
      font: 700 28px/1 Georgia, serif;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 54px);
      line-height: 1;
    }

    header p {
      margin: 15px 0 0;
      color: var(--muted);
    }

    main {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      padding: 24px 0 60px;
    }

    .destination {
      display: grid;
      min-height: 190px;
      align-content: space-between;
      border: 1px solid var(--line);
      border-top: 5px solid var(--teal);
      border-radius: 8px;
      padding: 24px;
      background: var(--surface);
      text-decoration: none;
      color: inherit;
    }

    a.destination:hover {
      border-color: var(--teal);
      box-shadow: 0 12px 32px rgba(23, 25, 29, 0.08);
    }

    .destination.game {
      border-top-color: var(--red);
    }

    .destination h2 {
      margin: 0 0 6px;
      font-size: 23px;
    }

    .destination p {
      margin: 0;
      color: var(--muted);
    }

    .action {
      margin-top: 25px;
      color: var(--teal);
      font-weight: 750;
    }

    .game .action {
      color: var(--red-dark);
    }

    @media (max-width: 620px) {
      header { padding-top: 38px; }
      main { grid-template-columns: 1fr; }
      .destination { min-height: 150px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true">λ</span>
      <h1>150prep</h1>
    </div>
    <p>Choose a study mode.</p>
  </header>

  <main>
    <a class="destination" href="lectures/">
      <div>
        <h2>Lecture podcasts</h2>
        <p>Lectures 11-20, ready to play.</p>
      </div>
      <span class="action">Listen now &rarr;</span>
    </a>

    <a class="destination game" href="gamified/">
      <div>
        <h2>Gamified review</h2>
        <p>Topic modules, checkpoints, and coding practice.</p>
      </div>
      <span class="action">Start reviewing &rarr;</span>
    </a>
  </main>
</body>
</html>
